<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Websim Auth Route</title>
  <link rel="stylesheet" href="./styles.css" />
  <script>
    // Expose a room at global scope per docs
    // This must run before other scripts that use `room`.
    // WebsimSocket is provided by the environment.
    const room = new WebsimSocket();
    window.room = room;
  </script>
</head>
<body>
  <main class="card">
    <h1>Auth Route — Websim</h1>
    <p id="desc">Reading challenge token...</p>
    <div class="row">
      <button id="submitBtn">Submit Challenge</button>
      <button id="refreshBtn">Send Recent Rows</button>
    </div>
    <pre id="log" aria-live="polite"></pre>
    <small class="hint">This page writes an auth_challenge record and posts updates to the parent window via postMessage.</small>
  </main>

  <script type="module" src="./app.js"></script>
